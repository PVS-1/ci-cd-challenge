name: Deploy Serverless Order Processing

on:
  push:
    branches: [ main ]
    paths:
    - '09-Serverless-CI-CD-Event-Driven-Arch-GitHub/lambdas/**'
    - '.github/workflows/deploy-serverless-orders.yml'
  workflow_dispatch:


permissions:
  contents: read

jobs:
  deploy-lambda-functions:
    name: Package and deploy order-processing Lambda functions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ secrets.AWS_REGION }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

    - name: Package and deploy Lambda functions
      shell: bash
      run: |
        set -euo pipefail
        for function_name in \
          cmtr_msdta2zd_lambda_createOrder \
          cmtr_msdta2zd_lambda_reserveStock \
          cmtr_msdta2zd_lambda_sendNotification; do
          (
            cd 09-Serverless-CI-CD-Event-Driven-Arch-GitHub/lambdas
            zip -q -r "../$function_name.zip" "$function_name"
          )
          aws lambda update-function-code \
            --function-name "$function_name" \
            --zip-file "fileb://09-Serverless-CI-CD-Event-Driven-Arch-GitHub/$function_name.zip" \
            --publish
          rm -f "09-Serverless-CI-CD-Event-Driven-Arch-GitHub/$function_name.zip"
        done
