version: 0.0
os: linux
files:
  - source: /
    destination: /opt/codedeploy-flask
    overwrite: true
file_exists_behavior: OVERWRITE
hooks:
  ApplicationStop:
    - location: scripts/stop-application.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/install-dependencies.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start-application.sh
      timeout: 60
      runas: root